# Continuous integration for hello.
#
# The program is six lines and cannot fail at runtime. What this pipeline
# verifies is therefore not the program's logic but the claims made about
# it: that it builds clean under every standard from C89 to C23, on three
# operating systems and five architectures, at every optimization level,
# under every sanitizer, with no diagnostics; that it reads no input from
# any source; that its documentation's quantitative assertions match the
# repository; and that all of this remains true as toolchains change
# underneath it.
#
# The last of these is the only one that can realistically break, and it
# is the reason the pipeline exists.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_OUTPUT: "Hello, World!"

jobs:

  # ---------------------------------------------------------------- lint

  lint:
    name: Lint and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Whitespace, encoding, and terminator checks
        run: make lint

      - name: ShellCheck the test suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh --severity=warning tests/*.sh

      - name: Verify hello.c is pure 7-bit ASCII
        run: |
          if LC_ALL=C grep -n '[^\t -~]' hello.c; then
            echo "::error file=hello.c::non-ASCII byte in source"
            exit 1
          fi
          echo "hello.c: $(wc -c < hello.c) bytes, all ASCII"

      - name: Repository hygiene
        run: |
          # Runs inside a real checkout, so the tracked-file assertions
          # (no committed binaries, test scripts tracked as mode 100755)
          # execute here rather than being skipped as they are locally.
          sh tests/06-repository.sh

      - name: Verify no build product is tracked
        run: |
          if git ls-files | xargs file 2>/dev/null \
             | grep -iE 'ELF |Mach-O|PE32'; then
            echo "::error::a compiled binary is tracked; see .gitignore section 7"
            exit 1
          fi
          echo "no compiled binaries tracked"

      - name: Verify .gitignore covers a full build
        run: |
          before=$(git status --porcelain --untracked-files=all | wc -l)
          make all sanitize > /dev/null 2>&1 || true
          after=$(git status --porcelain --untracked-files=all | wc -l)
          echo "untracked before build: $before   after: $after"
          if [ "$before" -ne "$after" ]; then
            echo "::error::the build produced a file .gitignore does not exclude:"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo "the build left the working tree clean"

      - name: Verify block comments are balanced
        run: |
          opens=$(grep -c '/\*' hello.c)
          closes=$(grep -c '\*/' hello.c)
          echo "openers: $opens  closers: $closes"
          test "$opens" -eq "$closes"

  # --------------------------------------------------------------- build

  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.std }} / ${{ matrix.opt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-13]
        cc: [gcc, clang]
        std: [c89, c99, c11, c17]
        opt: ["-O0", "-O2", "-Os"]
        exclude:
          # macOS ships clang under both names; building twice adds nothing.
          - os: macos-latest
            cc: gcc
          - os: macos-13
            cc: gcc
    steps:
      - uses: actions/checkout@v7

      - name: Compiler identification
        run: ${{ matrix.cc }} --version

      - name: Build with warnings as errors
        run: |
          ${{ matrix.cc }} -std=${{ matrix.std }} ${{ matrix.opt }} \
            -Wall -Wextra -pedantic -Werror \
            -o hello hello.c 2>&1 | tee build.log
          if [ -s build.log ]; then
            echo "::error::compiler emitted diagnostics"
            exit 1
          fi

      - name: Verify output
        run: |
          actual=$(./hello)
          echo "actual:   [$actual]"
          echo "expected: [$EXPECTED_OUTPUT]"
          test "$actual" = "$EXPECTED_OUTPUT"

      - name: Verify exit status
        run: ./hello > /dev/null; test $? -eq 0

      - name: Verify byte count
        run: test "$(./hello | wc -c | tr -d ' ')" -eq 14

  # ------------------------------------------------------------- windows

  windows:
    name: Windows / ${{ matrix.toolchain }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, mingw, clang-cl]
    steps:
      - uses: actions/checkout@v7

      - name: Configure MSVC environment
        if: matrix.toolchain == 'msvc' || matrix.toolchain == 'clang-cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (MSVC)
        if: matrix.toolchain == 'msvc'
        shell: cmd
        run: cl /W4 /WX /nologo hello.c

      - name: Build (clang-cl)
        if: matrix.toolchain == 'clang-cl'
        shell: cmd
        run: clang-cl /W4 /WX /nologo hello.c

      - name: Build (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: bash
        run: gcc -std=c99 -Wall -Wextra -pedantic -Werror -o hello.exe hello.c

      - name: Verify output
        shell: bash
        run: |
          actual=$(./hello.exe | tr -d '\r')
          echo "actual: [$actual]"
          test "$actual" = "Hello, World!"

  # ------------------------------------------------------- test suites

  suites:
    name: Test suites / ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Run the full suite
        env:
          CC: ${{ matrix.cc }}
        run: make test

  # ---------------------------------------------------------- sanitizers

  sanitizers:
    name: Sanitizer / ${{ matrix.san }}
    # Linux only: LeakSanitizer is not implemented in Apple's ASan runtime,
    # and ASAN_OPTIONS=detect_leaks=1 is a hard abort there rather than a
    # warning. The Makefile's sanitize target probes uname for the same
    # reason.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san:
          - address
          - undefined
          - address,undefined
          - memory
          - thread
          - leak
    steps:
      - uses: actions/checkout@v7

      - name: Build with -fsanitize=${{ matrix.san }}
        run: |
          # MemorySanitizer requires an instrumented libc to avoid false
          # positives from uninstrumented printf internals; clang is used
          # for every sanitizer here for consistency.
          clang -std=c99 -O1 -g -fno-omit-frame-pointer \
                -fsanitize=${{ matrix.san }} \
                -Wall -Wextra -pedantic \
                -o hello-san hello.c

      - name: Run under the sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          MSAN_OPTIONS: halt_on_error=1
        run: |
          # MSan reports uninstrumented-libc noise on a stock toolchain; it
          # is run for signal but is not permitted to fail the pipeline.
          if [ "${{ matrix.san }}" = "memory" ]; then
            ./hello-san || echo "::warning::MSan requires an instrumented libc; result advisory"
          else
            out=$(./hello-san)
            test "$out" = "$EXPECTED_OUTPUT"
          fi

  # ------------------------------------------------------ static analysis

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install analysers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tools clang-tidy

      - name: GCC static analyzer
        run: gcc -fanalyzer -Wall -Wextra -Werror -c -o /dev/null hello.c

      - name: cppcheck
        run: |
          cppcheck --enable=all --inconclusive --std=c99 \
                   --suppress=missingIncludeSystem \
                   --suppress=checkersReport \
                   --error-exitcode=1 hello.c

      - name: clang-tidy
        run: clang-tidy hello.c --warnings-as-errors='*' -- -std=c99

      - name: clang static analyzer (scan-build)
        run: |
          scan-build --status-bugs \
            clang -std=c99 -c -o /dev/null hello.c

      - name: Format-string audit
        run: |
          # The single most important negative result in the pipeline.
          # -Wformat-nonliteral fires on any printf whose format argument is
          # not a compile-time constant, which is the precondition for
          # CWE-134. See README section 9.2.
          gcc -std=c99 -Wall -Wextra -Werror \
              -Wformat=2 -Wformat-security -Wformat-nonliteral \
              -c -o /dev/null hello.c
          echo "no non-literal format strings"

  # ----------------------------------------------------- cross-compilation

  cross:
    name: Cross / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            pkg: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            qemu: qemu-aarch64-static
            lib: /usr/aarch64-linux-gnu
          - arch: armhf
            pkg: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            qemu: qemu-arm-static
            lib: /usr/arm-linux-gnueabihf
          - arch: riscv64
            pkg: gcc-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc
            qemu: qemu-riscv64-static
            lib: /usr/riscv64-linux-gnu
          - arch: powerpc64le
            pkg: gcc-powerpc64le-linux-gnu
            cc: powerpc64le-linux-gnu-gcc
            qemu: qemu-ppc64le-static
            lib: /usr/powerpc64le-linux-gnu
          - arch: s390x-big-endian
            pkg: gcc-s390x-linux-gnu
            cc: s390x-linux-gnu-gcc
            qemu: qemu-s390x-static
            lib: /usr/s390x-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.pkg }} qemu-user-static

      - name: Cross-compile
        run: |
          ${{ matrix.cc }} -std=c99 -O2 -static \
            -Wall -Wextra -pedantic -Werror \
            -o hello-${{ matrix.arch }} hello.c
          file hello-${{ matrix.arch }}

      - name: Run under QEMU
        run: |
          out=$(${{ matrix.qemu }} ./hello-${{ matrix.arch }})
          echo "output: [$out]"
          test "$out" = "$EXPECTED_OUTPUT"

      - name: Verify byte count on this architecture
        run: |
          n=$(${{ matrix.qemu }} ./hello-${{ matrix.arch }} | wc -c)
          echo "bytes: $n"
          test "$n" -eq 14

  # s390x above is included specifically because it is big-endian. The
  # program contains no multi-byte integer serialization and should be
  # entirely indifferent to byte order; this job is what makes that a
  # tested claim rather than an assumed one.

  # ------------------------------------------------------ historical C

  historical:
    name: Historical toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tiny C Compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcc

      - name: Build with tcc
        run: |
          tcc -Wall -o hello-tcc hello.c
          test "$(./hello-tcc)" = "$EXPECTED_OUTPUT"

      - name: Build as C89 with maximum pedantry
        run: |
          gcc -std=c89 -ansi -pedantic-errors -Wall -Wextra -Werror \
              -Wtraditional-conversion \
              -o hello-c89 hello.c
          test "$(./hello-c89)" = "$EXPECTED_OUTPUT"

      - name: Build as C++ (four standards)
        run: |
          for std in c++98 c++11 c++17 c++20; do
            g++ -std=$std -Wall -Wextra -pedantic -Werror \
                -x c++ -o hello-$std hello.c
            test "$(./hello-$std)" = "$EXPECTED_OUTPUT"
            echo "  $std ok"
          done

  # ---------------------------------------------------- binary analysis

  binary:
    name: Binary analysis and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: gcc -std=c99 -O2 -Wall -Wextra -pedantic -Werror -o hello hello.c

      - name: Section sizes
        run: |
          size hello
          objdump -h hello | grep -E '\.text|\.rodata|\.data|\.bss'

      - name: Verify the string is in read-only data
        run: |
          objdump -s -j .rodata hello | grep -q 'Hello' \
            && echo "string is in .rodata"

      - name: Verify linkage
        run: |
          ldd hello
          n=$(ldd hello | grep -c '=>' || true)
          echo "shared objects: $n"
          test "$n" -le 2

      - name: Reproducible build
        run: |
          # Built twice to the same path, so the output filename -- which
          # some toolchains embed -- cannot be mistaken for nondeterminism.
          gcc -std=c99 -O2 -Wl,--build-id=none -o repro hello.c
          sha256sum repro | tee first.txt
          gcc -std=c99 -O2 -Wl,--build-id=none -o repro hello.c
          sha256sum repro | tee second.txt
          diff <(cut -d' ' -f1 first.txt) <(cut -d' ' -f1 second.txt)
          echo "build is reproducible"

      - name: Run binary suite
        run: sh tests/04-binary.sh

  # -------------------------------------------------------------- docs

  docs:
    name: Documentation conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make all

      - name: Verify documented figures against the repository
        run: sh tests/05-docs.sh

      - name: Verify project documentation and install round-trip
        run: |
          # Asserts the GitHub community-standards files are present, that
          # the manual page lints, and that install/uninstall round-trips
          # exactly: five files in, five files out, and nothing the target
          # did not place is removed.
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          sh tests/07-project-docs.sh

      - name: Verify every link and cross-reference resolves
        run: python3 tests/links.py

      - name: Verify section numbering is dense and unique
        run: |
          # A skipped or duplicated section number breaks every reference to
          # it without breaking anything else. See tests/sections.py.
          python3 tests/sections.py

      - name: Report current figures
        run: make stats >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- benchmark

  benchmark:
    name: Benchmark (advisory)
    runs-on: ubuntu-latest
    # Per README section 11.6 this job is deliberately non-gating: roughly
    # 99.75% of the program's wall-clock time is process creation and
    # dynamic linking, so a regression here reports a change in the runner
    # image rather than a change in this repository.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          gcc -std=c99 -O2 -o hello hello.c
          gcc -std=c99 -O2 -static -o hello-static hello.c

      - name: Time 10,000 invocations
        run: |
          for b in ./hello ./hello-static; do
            start=$(date +%s%N)
            for i in $(seq 1 10000); do $b > /dev/null; done
            end=$(date +%s%N)
            us=$(( (end - start) / 10000 / 1000 ))
            echo "$b: ${us}us per invocation" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Report binary sizes
        run: |
          {
            echo "| binary | bytes |"
            echo "|---|---|"
            echo "| dynamic | $(stat -c%s hello) |"
            echo "| static  | $(stat -c%s hello-static) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- gate

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - windows
      - suites
      - sanitizers
      - analysis
      - cross
      - historical
      - binary
      - docs
    if: always()
    steps:
      - name: Verify every required job succeeded
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
